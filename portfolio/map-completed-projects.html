<!DOCTYPE html>

  <title>Map of Completed Projects – Conception Radical</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    .map-container {
      width: 100%;
      height: 600px;

    }

      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;

<header class="site-header">
  <div class="header-background">

      <h1 class="site-title">
        <a href="../index.html">
          <img src="../assets/logo.png" alt="Conception Radical logo" class="logo">
        </a>
      </h1>

      <nav class="site-nav">
        <a href="../index.html" style="font-weight: 600;">Home</a>
        <a href="../services.html" style="font-weight: 600;">Services</a>
        <a href="../news.html" style="font-weight: 600;">News</a>
        <a href="../portfolio.html" style="font-weight: 600; color: var(--accent);">Portfolio</a>
        <a href="../knowledge-base.html" style="font-weight: 600;">Knowledge Base</a>

        <a href="../client-portal.html" style="font-weight: 600;">Client Portal</a>

  </div>

      </p>

        <iframe src="map.html" title="Interactive Map of Completed Projects" allowfullscreen=""></iframe>

        <a href="../portfolio.html">← Back to Portfolio</a>
